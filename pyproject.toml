[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "canoe-agriculture"
version = "1.0.0"
description = "Agriculture sector module for CANOE"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pandas",
    "pyyaml",
    "requests",
    "lxml",
    "canoe_schema @ git+ssh://git@github.com/CANOE-main/canoe-schema.git"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff",
    "mypy",
    "black"
]

[project.urls]
Repository = "https://github.com/CANOE-main/canoe-agriculture"

[tool.hatch.version]
path = "canoe_agriculture/__init__.py"

[tool.hatch.metadata] 
allow-direct-references = true

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
